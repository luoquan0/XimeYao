[package]
name = "winxime-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0"
repository.workspace = true

[dependencies]
# Portable test: keep clipboard and backup pages; upstream voice-page fails to compile on Windows.
xime-setup-lib = { workspace = true, features = ["clipboard-page", "backup-page"] }
xime-config.workspace = true
winxime-ipc.workspace = true
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
tracing.workspace = true

[[bin]]
name = "winxime-setup"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
